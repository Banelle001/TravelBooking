<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <title>Login</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            background-color: #fff;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label, input {
            display: block;
            width: 100%;
        }
        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
        .link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</h:head>

<h:body>
    <div>
        <ui:include src="nav.xhtml"/>
    </div>
    <div class="main-content">
        <div class="container">
            <h2>Login</h2>
            <h:form>
                <h:messages globalOnly="true" styleClass="error" />

                <div class="form-group">
                    <h:outputLabel for="email" value="Email" />
                    <h:inputText id="email" value="#{userBean.user.email}" required="true" />
                </div>

                <div class="form-group">
                    <h:outputLabel for="password" value="Password" />
                    <h:inputSecret id="password" value="#{userBean.user.password}" required="true" />
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <h:commandButton value="Login" action="#{userBean.login}" />
                </div>

                <div class="link">
                    <h:outputLink value="signup.xhtml">Don't have an account? Sign up</h:outputLink>
                </div>
            </h:form>
        </div>
    </div>
</h:body>

<div>
    <ui:include src="footer.xhtml"/>
</div>

</html>
