<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>My Bookings</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css"/>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f8fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .h2 {
            text-align: center;
            color: #2a2a72;
            margin-bottom: 25px;
        }

        .booking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .booking-table th, .booking-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .booking-table th {
            background-color: #edf0f8;
            color: #333;
            font-weight: 600;
        }

        .booking-table tr:hover {
            background-color: #f1f5ff;
        }

        .btn-primary {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff5e57;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #e14b4a;
        }

        .no-bookings, .login-reminder {
            text-align: center;
            margin-top: 30px;
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</h:head>

<h:body>
    <div>
        <ui:include src="nav.xhtml"/>
    </div>

    <div class="main-content">
        <div class="container">
            <h2 class="h2">My Bookings</h2>

            <h:messages globalOnly="true" styleClass="error" />

            <h:form rendered="#{not empty bookingBean.userBookings}">
                <div class="booking-list">
                    <h:dataTable value="#{bookingBean.userBookings}" var="booking"
                                 styleClass="booking-table" headerClass="table-header">


                        <h:column>
                            <f:facet name="header">Full Name</f:facet>
                            #{booking.fullname}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Check-In</f:facet>
                            <h:outputText value="#{booking.checkindate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </h:column>

                        <h:column>
                            <f:facet name="header">Check-Out</f:facet>
                            <h:outputText value="#{booking.checkoutdate}">
                                <f:convertDateTime pattern="yyyy-MM-dd" />
                            </h:outputText>
                        </h:column>
                        
                        <h:column>
                            <f:facet name="header">Room Type</f:facet>
                            #{booking.room.type}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Price</f:facet>
                            R#{booking.room.price}
                        </h:column>


                        <h:column>
                            <f:facet name="header">Guests</f:facet>
                            #{booking.numberOfTravelers}
                        </h:column>

                        <h:column>
                            <f:facet name="header">Special Requests</f:facet>
                            #{booking.specialRequests}
                        </h:column>

                      <h:column>
        <f:facet name="header">Payment</f:facet>
        <h:form>
            <h:commandButton value="Proceed to Payment"
                             action="payment.xhtml?faces-redirect=true"
                             styleClass="btn-primary" />
        </h:form>
    </h:column>


                    </h:dataTable>
                </div>
            </h:form>

            <h:panelGroup rendered="#{empty bookingBean.userBookings and userBean.loggedIn}">
                <div class="no-bookings">
                    <p>You don't have any bookings yet.</p>
                    <h:link outcome="create-booking" value="Create a new booking" styleClass="btn-primary"/>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{not userBean.loggedIn}">
                <div class="login-reminder">
                    <p>Please login to view your bookings.</p>
                    <h:link outcome="login" value="Login" styleClass="btn-primary"/>
                </div>
            </h:panelGroup>
        </div>
    </div>

    <div>
        <ui:include src="footer.xhtml"/>
    </div>
</h:body>
</html>
