<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Create New Booking</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f8fb;
            margin: 0;
            padding: 0;
        }

        .main-content {
            padding: 40px 0;
            display: flex;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h1, h3 {
            color: #2a2a72;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .new {
            color: #2a2a72;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: border 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff5e57;
            outline: none;
        }

        .btn-primary {
            background-color: #ff5e57;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #e14b4a;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</h:head>

<h:body>
    <div>
        <ui:include src="nav.xhtml"/>
    </div>  

    <div class="main-content">
        <div class="container">
            <h2 class="new">Create New Booking</h2>
            <h:form>
                <h:messages globalOnly="true" styleClass="error" />

                <h1>Personal Details</h1>

                <div class="form-group">
                    <h:outputLabel for="fullname" value="Full Name *" />
                    <h:inputText id="fullname" value="#{bookingBean.booking.fullname}" required="true"
                                 requiredMessage="Full name is required"/>
                </div>

                <div class="form-group">
                    <h:outputLabel for="email" value="Email *" />
                    <h:inputText id="email" value="#{bookingBean.booking.email}" required="true"
                                 requiredMessage="Email is required"/>
                </div>

                <h1>Dates</h1>

                <div class="form-group">
                    <h:outputLabel for="checkindate" value="Check In Date *" />
                    <h:inputText id="checkindate" value="#{bookingBean.booking.checkindate}" required="true"
                                 requiredMessage="Check-in date is required">
                        <f:convertDateTime pattern="yyyy-MM-dd" />
                        <f:passThroughAttribute name="type" value="date" />
                        <f:passThroughAttribute name="min" value="#{bookingBean.todayDate}" />
                    </h:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="checkoutdate" value="Check Out Date *" />
                    <h:inputText id="checkoutdate" value="#{bookingBean.booking.checkoutdate}" required="true"
                                 requiredMessage="Check-out date is required">
                        <f:convertDateTime pattern="yyyy-MM-dd" />
                        <f:passThroughAttribute name="type" value="date" />
                        <f:passThroughAttribute name="min" value="#{bookingBean.todayDate}" />
                    </h:inputText>
                </div>

                <h3>Guests</h3>

                <div class="form-group">
                    <h:outputLabel for="numberOfTravelers" value="Number of Guests *" />
                    <h:inputText id="numberOfTravelers" value="#{bookingBean.booking.numberOfTravelers}" 
                                required="true" requiredMessage="Number of guests is required">
                        <f:validateLongRange minimum="1" />
                        <f:validateLongRange maximum="5" />
                        <f:passThroughAttribute name="type" value="number" />
                        <f:passThroughAttribute name="min" value="1" />
                        <f:passThroughAttribute name="max" value="5" />
                    </h:inputText>
                </div>

                <div class="form-group">
                    <h:outputLabel for="specialRequests" value="Special Requests" />
                    <h:inputTextarea id="specialRequests" value="#{bookingBean.booking.specialRequests}" 
                                    rows="3" cols="50"/>
                </div>

                <div style="text-align: center; margin-top: 20px;">
                    <h:commandButton value="Create Booking" action="#{bookingBean.createBooking}" 
                                    styleClass="btn-primary" />
                </div>
            </h:form>
        </div>
    </div>

    <div>
        <ui:include src="footer.xhtml"/>
    </div>
</h:body>
</html>
